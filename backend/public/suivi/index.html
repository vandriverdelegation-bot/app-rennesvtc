<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Suivi de mission</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    color-scheme: dark;
    --bg: #101211; --card: #121515; --card-2: #181c1b; --border: #272c2b;
    --accent: #22C55E; --accent-text: #06130B; --text: #F4F7F5; --muted: #A3ADA8;
    --amber: #F5B83D; --error: #FF6B6B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; }
  svg { display: block; }

  /* Bandeau du haut */
  .topbar { border-bottom: 1px solid var(--border); background: radial-gradient(ellipse 60% 140% at 78% 0%, #2a2d2c 0%, transparent 60%), linear-gradient(90deg, #0c0e0d 0%, #131514 100%); }
  .top { max-width: 1320px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 28px; }
  .top img.logo { height: 66px; width: auto; display: block; }
  .vsep { width: 1px; height: 52px; background: var(--border); }
  .help { display: flex; align-items: center; gap: 14px; color: var(--text); text-decoration: none; }
  .help svg { width: 44px; height: 44px; }
  .help small { display: block; color: var(--muted); font-size: 15px; }
  .help b { font-size: 22px; font-weight: 600; letter-spacing: .01em; }
  .home { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; padding: 13px 24px; border-radius: 999px; border: 1.5px solid #d8dcda; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; background: rgba(0,0,0,.35); }
  .home svg { width: 22px; height: 22px; }
  .home:hover { border-color: var(--accent); }

  .page { max-width: 1320px; margin: 0 auto; padding: 26px 28px 20px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: stretch; }
  .left { display: grid; gap: 18px; min-width: 0; align-content: start; }
  .rightcol { position: relative; }

  /* Titre */
  .titlerow { display: flex; align-items: center; gap: 18px; }
  .titlerow .dot { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .titlerow h1 { margin: 0; font-size: 40px; line-height: 1.1; letter-spacing: -.015em; white-space: nowrap; }
  .titlerow .rule { flex: 1; height: 1px; background: var(--border); min-width: 20px; }
  .titlerow .when { color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .subtitle { margin: 6px 0 0 50px; color: var(--muted); font-size: 18px; }
  .subtitle b { color: var(--accent); font-weight: 700; }
  .cancelled { background: color-mix(in srgb, var(--error) 14%, transparent); color: var(--error); border-radius: 14px; padding: 12px 16px; font-weight: 700; }

  /* Carte */
  .mapbox { position: relative; }
  #map { height: 250px; background: #232726; border-radius: 22px; overflow: hidden; border: 1px solid var(--border); }
  .leaflet-container { font-family: inherit; background: #232726; }
  /* Fond de carte OpenStreetMap assombri et desature (les fonds sombres de tiers demandent une cle payante). */
  .leaflet-tile-pane { filter: invert(1) grayscale(1) brightness(.95) contrast(.95); }
  .leaflet-control-zoom { display: none; }
  .routebtn { position: absolute; right: 16px; top: 16px; z-index: 600; display: inline-flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; border: 1px solid #3a403e; background: rgba(14,16,15,.92); color: var(--text); font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
  .routebtn svg { width: 20px; height: 20px; }
  .routebtn .chev { width: 16px; height: 16px; transition: transform .2s; }
  .routebtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .routepanel { position: absolute; right: 16px; top: 66px; z-index: 600; width: min(380px, calc(100% - 32px)); padding: 16px; border-radius: 16px; border: 1px solid #3a403e; background: rgba(12,14,13,.96); display: none; }
  .routepanel.open { display: block; }
  .route { display: grid; gap: 12px; }
  .stop { display: flex; gap: 12px; font-size: 14px; }
  .stop i { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--accent); }
  .stop i.mid { background: var(--amber); }
  .stop i.end { background: var(--error); }
  .stop small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { padding: 4px 12px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .live { position: absolute; left: 16px; top: 16px; z-index: 600; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: rgba(14,16,15,.92); border: 1px solid #3a403e; font-size: 13px; font-weight: 700; color: var(--accent); }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  .map-note { color: var(--muted); font-size: 13px; margin: -8px 0 0; }

  .pinwrap { position: relative; width: 0; height: 0; }
  .pinwrap svg { position: absolute; left: -15px; top: -42px; width: 30px; height: 42px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .plabel { position: absolute; left: 20px; top: -36px; padding: 5px 12px; border-radius: 9px; background: rgba(10,12,11,.95); border: 1px solid #3a403e; color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .car { width: 20px; height: 34px; border-radius: 9px; background: #0A0A0A; border: 2px solid #fff; display: flex; flex-direction: column; align-items: center; padding: 4px 0; gap: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .car b { width: 12px; border-radius: 3px; background: #6B7280; display: block; }
  .car b:nth-child(1) { height: 7px; } .car b:nth-child(2) { height: 8px; background: #1F2937; } .car b:nth-child(3) { height: 5px; }

  /* Chauffeur */
  .driver { display: flex; align-items: center; gap: 26px; padding: 22px 30px; border-radius: 22px; background: var(--card); border: 1px solid var(--border); min-width: 0; }
  .avatarwrap { position: relative; flex-shrink: 0; }
  .avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 2px solid #3a403e; background: var(--card-2); display: grid; place-items: center; color: var(--accent); font-weight: 800; font-size: 38px; }
  .avatarwrap::after { content: ''; position: absolute; right: 6px; bottom: 6px; width: 17px; height: 17px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card); }
  .dinfo { flex: 1; min-width: 0; }
  .dinfo strong { display: block; font-size: 32px; line-height: 1.1; }
  .role { color: var(--muted); font-size: 19px; margin-top: 2px; }
  .carline { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 16px; font-size: 17px; }
  .carline svg { width: 30px; height: 30px; color: var(--muted); }
  .carline .vsep { height: 30px; }
  .plate { padding: 7px 16px; border-radius: 8px; border: 1.5px solid #8a928e; font-size: 17px; font-weight: 600; letter-spacing: .04em; }
  .carphoto { border-radius: 14px; width: 330px; max-width: 38%; height: 120px; object-fit: contain; flex-shrink: 0; }

  /* Etapes */
  .steps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .step { position: relative; text-align: center; padding: 0 3px; }
  .step::before { content: ''; position: absolute; top: 21px; left: -50%; width: 100%; height: 3px; background: #343a38; }
  .step:first-child::before { display: none; }
  .step.done::before { background: var(--accent); }
  .ic { position: relative; z-index: 1; width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 50%; border: 2px solid #4a514e; background: var(--bg); display: grid; place-items: center; color: #8d9692; }
  .ic svg { width: 21px; height: 21px; }
  .step.done .ic { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
  .step.current .ic { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }
  .step .label { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .step .time { font-size: 13px; color: var(--muted); margin-top: 3px; min-height: 1em; }
  .step.todo .label { color: var(--muted); }

  /* Boutons */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 4px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 14px; height: 64px; border-radius: 999px; font: inherit; font-size: 19px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1.5px solid #e4e8e6; color: var(--text); background: transparent; }
  .btn svg { width: 26px; height: 26px; }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn:hover { filter: brightness(1.12); }
  .btn[disabled] { opacity: .4; cursor: default; }

  /* Chat */
  .chat { position: absolute; inset: 0; display: flex; flex-direction: column; border-radius: 24px; background: #0d100f; border: 1px solid var(--border); overflow: hidden; }
  .chat-head { display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--border); background: #121615; }
  .chat-head .bubble { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #fff; }
  .chat-head .bubble svg { width: 24px; height: 24px; }
  .chat-head h2 { margin: 0; font-size: 26px; flex: 1; }
  .chat-head button { background: none; border: 0; color: var(--text); cursor: pointer; padding: 6px; }
  .chat-head button svg { width: 26px; height: 26px; }
  .chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat.min .chat-body { display: none; }
  .chat.min { inset: 0 0 auto 0; }
  .chat-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 22px; }
  .msg { max-width: 84%; padding: 14px 18px 10px; border-radius: 18px; font-size: 17px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; align-self: flex-start; background: #b4b6ba; color: #15181a; border-bottom-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: #212327; color: var(--text); border: 1px solid #2e3135; border-bottom-left-radius: 18px; border-bottom-right-radius: 4px; }
  .msg time { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; font-size: 13px; opacity: .7; }
  .msg.me time { color: var(--muted); opacity: 1; }
  .msg.me time svg { width: 17px; height: 17px; color: var(--accent); }
  .chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: 15px; padding: 20px; }
  .chat-form { display: flex; align-items: center; gap: 10px; margin: 0 18px 18px; padding: 8px 8px 8px 22px; border-radius: 999px; border: 1px solid #343936; background: #101312; }
  .chat-form input { flex: 1; min-width: 0; border: 0; background: transparent; color: inherit; font: inherit; font-size: 17px; }
  .chat-form input:focus { outline: none; }
  .chat-form:focus-within { border-color: var(--accent); }
  .chat-form button { width: 54px; height: 54px; flex-shrink: 0; border: 0; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .chat-form button svg { width: 26px; height: 26px; }

  .safe { display: flex; align-items: center; gap: 18px; justify-content: center; margin-top: 18px; padding: 18px 28px 0; border-top: 1px solid var(--border); color: var(--text); font-size: 18px; }
  .safe svg { width: 30px; height: 30px; color: var(--muted); }
  .safe::before, .safe::after { content: ''; flex: 1; max-width: 520px; height: 1px; background: var(--border); }
  .center { text-align: center; padding: 100px 16px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }

  /* Tablette et telephone : une seule colonne, chat sous la page */
  @media (max-width: 1000px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .chat { position: static; height: 480px; }
    .chat.min { height: auto; }
    .titlerow h1 { font-size: 32px; }
    .carphoto { width: 240px; }
  }
  @media (max-width: 680px) {
    .top { padding: 12px 16px; gap: 14px; }
    .top img.logo { height: 48px; }
    .help small, .vsep { display: none; }
    .help b { font-size: 16px; }
    .help svg { width: 34px; height: 34px; }
    .home { padding: 10px; }
    .home span { display: none; }
    .page { padding: 18px 14px 16px; }
    .titlerow { gap: 12px; }
    .titlerow .dot { width: 22px; height: 22px; }
    .titlerow h1 { font-size: 26px; white-space: normal; }
    .titlerow .rule, .titlerow .when { display: none; }
    .subtitle { margin-left: 0; font-size: 15px; }
    #map { height: 300px; }
    .routebtn { padding: 9px 12px; font-size: 14px; right: 10px; top: 10px; }
    .routepanel { right: 10px; top: 56px; }
    .driver { flex-wrap: wrap; padding: 18px; gap: 16px; }
    .avatar { width: 76px; height: 76px; font-size: 28px; }
    .dinfo strong { font-size: 24px; }
    .role { font-size: 16px; }
    .carline { font-size: 15px; gap: 10px; }
    .carphoto { width: 100%; max-width: none; height: 130px; }
    .steps { grid-template-columns: 1fr; gap: 0; }
    .step { display: flex; gap: 16px; text-align: left; padding: 0 0 18px; align-items: flex-start; }
    .step:last-child { padding-bottom: 0; }
    .step::before { left: 21px; top: 44px; bottom: 0; width: 3px; height: auto; display: block; background: #343a38; }
    .step:first-child::before { display: block; }
    .step:last-child::before { display: none; }
    .step.done:not(.current)::before { background: var(--accent); }
    .ic { margin: 0; flex-shrink: 0; }
    .step > div { padding-top: 2px; }
    .actions { grid-template-columns: 1fr; gap: 12px; }
    .btn { height: 56px; font-size: 17px; }
    .safe { font-size: 15px; gap: 10px; }
    .safe::before, .safe::after { display: none; }
  }
</style>
</head>
<body>
<div class="topbar"><div class="top">
  <img class="logo" src="/suivi/logo.png" alt="Rennes VTC" />
  <span class="vsep"></span>
  <a class="help" href="tel:+33768425262">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 28v-6a16 16 0 0 1 32 0v6"/><rect x="5" y="24" width="8" height="13" rx="3"/><rect x="35" y="24" width="8" height="13" rx="3"/><path d="M39 37c0 4-4 6-10 6"/><circle cx="26" cy="43" r="2.4" fill="#22C55E" stroke="none"/></svg>
    <span><small>Une question ?</small><b>+33 7 68 42 52 62</b></span>
  </a>
  <a class="home" href="https://www.rennesvtc.com"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg><span>Retour à l'accueil</span></a>
</div></div>

<div class="page" id="root"><div class="center">Chargement du suivi...</div></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const token = location.pathname.split('/').filter(Boolean).pop();
const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const clock = (iso) => iso ? new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
const PHONE = '+33768425262';

const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>',
  dcheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 13 4 4 8-9M10 15l2 2 9-10"/></svg>',
  car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3.5v-4l2-5.5A2 2 0 0 1 7.4 6h9.2a2 2 0 0 1 1.9 1.5l2 5.5v4H19"/><path d="M3.5 13h17"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/><path d="M9.3 17h5.4"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h1.8v18H6zM9 4h10l-2.6 4L19 12H9z"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><circle cx="8" cy="11" r="1.3" fill="#0d100f"/><circle cx="12" cy="11" r="1.3" fill="#0d100f"/><circle cx="16" cy="11" r="1.3" fill="#0d100f"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 11.3 21 3.5c.8-.3 1.5.4 1.2 1.2L14.4 21c-.4.8-1.5.7-1.7-.1l-1.6-6.2-6.2-1.6c-.8-.2-.9-1.3-.1-1.7z"/><path d="m11 14 6-6" stroke="#0d100f" stroke-width="1.4" fill="none"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v6c0 4.6 3.1 7.7 7.5 9 4.4-1.3 7.5-4.4 7.5-9V6z"/><path d="m8.8 12.2 2.4 2.4 4-4.6"/></svg>',
  routeIc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
};

let map = null, carMarker = null, lastKey = '', routeOpen = false;
let chatOpen = false, chatKey = '', chatDraft = '', chatMin = false;

// Photo du vehicule attribue : celle du vehicule s'il en a une, sinon une photo de sa gamme (memes regles que les e-mails).
function carPhoto(v) {
  if (!v) return null;
  if (v.photo_url) return v.photo_url;
  const n = String(v.display_name || '').toLowerCase();
  if (/camry/.test(n)) return '/mail/car_camry.jpg';
  if (/classe\s*e/.test(n)) return '/mail/car_classe-e.jpg';
  if (/classe\s*v|van|vito/.test(n) || v.vehicle_category === 'van') return '/mail/car_van.jpg';
  return v.vehicle_category === 'confort' ? '/mail/car_camry.jpg' : '/mail/car_classe-e.jpg';
}

// Chat avec le chauffeur : panneau de droite, hors de la zone reconstruite a chaque changement.
function chatHtml(active, hasDriver) {
  const empty = active ? '' : '<div class="chat-empty">' + (hasDriver ? 'La mission est terminée : la messagerie est fermée.<br>Merci pour votre confiance.' : 'La messagerie s\'ouvrira ici dès que votre chauffeur sera attribué.') + '</div>';
  return `<section class="chat ${chatMin ? 'min' : ''}" id="chat">
    <div class="chat-head"><span class="bubble">${I.chat}</span><h2>Chat</h2><button type="button" id="chat-min" aria-label="Réduire le chat">${I.minus}</button></div>
    <div class="chat-body">
      <div class="chat-list" id="chat-list">${empty}</div>
      ${active ? `<form class="chat-form" id="chat-form"><input id="chat-input" maxlength="1000" placeholder="Écrivez votre message..." autocomplete="off" aria-label="Votre message" /><button type="submit" aria-label="Envoyer">${I.send}</button></form>` : ''}
    </div>
  </section>`;
}

async function loadChat() {
  const list = document.getElementById('chat-list');
  if (!chatOpen || !list) return;
  try {
    const res = await fetch('/public/track/' + encodeURIComponent(token) + '/messages', { cache: 'no-store' });
    if (!res.ok) return;
    const { messages } = await res.json();
    const key = JSON.stringify(messages.map((m) => m.id));
    if (key === chatKey && list.firstChild) return;
    chatKey = key;
    list.innerHTML = messages.length
      ? messages.map((m) => { const me = m.role === 'donneur_ordre'; return '<div class="msg ' + (me ? 'me' : '') + '">' + esc(m.body) + '<time>' + esc(clock(m.created_at)) + (me ? I.dcheck : '') + '</time></div>'; }).join('')
      : '<div class="chat-empty">Aucun message pour le moment.</div>';
    list.scrollTop = list.scrollHeight;
  } catch (e) { /* reseau instable : prochain tour */ }
}

async function sendChat(e) {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const body = input.value.trim();
  if (!body) return;
  input.value = ''; chatDraft = '';
  const res = await fetch('/public/track/' + encodeURIComponent(token) + '/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ body }) });
  if (!res.ok) { input.value = body; alert((await res.json().catch(() => ({}))).error || 'Envoi impossible.'); return; }
  chatKey = '';
  loadChat();
}

// near : heure de l'alerte « arrivee proche » (ou 'ignore' pour un trajet trop court : l'etape n'est alors pas affichee).
const nearOf = (r) => (r.step_times && r.step_times.near && r.step_times.near !== 'ignore' ? r.step_times.near : null);
const hhmm = (iso) => new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }).replace(':', 'h');

function progress(r) {
  if (r.status === 'completed') return 7;
  if (r.ride_step === 'dropped') return 6;
  if (r.ride_step === 'on_board' && nearOf(r)) return 5;
  if (r.ride_step === 'on_board') return 4;
  if (r.ride_step === 'on_site') return 3;
  if (r.ride_step === 'en_route') return 2;
  if (r.status === 'accepted') return 1;
  return 0;
}

function headline(r, mad) {
  if (r.status === 'cancelled') return ['Mission annulée', ''];
  if (r.ride_step === 'no_show') return ['Passager absent', 'Le chauffeur a attendu sur place : la mission est clôturée pour non-présentation.'];
  if (r.status === 'completed') return ['Mission terminée', 'Merci de votre confiance.'];
  if (r.ride_step === 'dropped') return ['Passager déposé', 'Il a été déposé à destination.'];
  if (r.ride_step === 'on_board' && nearOf(r)) return ['Arrivée proche', 'Le passager arrive dans quelques minutes : l\'accueil est prévenu.'];
  if (r.ride_step === 'on_board') {
    const eta = r.step_times && r.step_times.eta_at;
    return ['Passager à bord', eta && new Date(eta) > new Date() ? 'Arrivée prévue vers ' + hhmm(eta) + '.' : 'La mission est en cours.'];
  }
  if (r.ride_step === 'on_site') return mad ? ['Mission en cours', 'Le chauffeur est à votre disposition.'] : ['Le chauffeur est arrivé', 'Il vous attend au point de prise en charge.'];
  if (r.ride_step === 'en_route') return ['Le chauffeur est en route', 'Suivez sa position en direct sur la carte.'];
  if (r.status === 'accepted') return ['Chauffeur attribué', 'Il se mettra en route à l\'heure prévue. Cette page se met à jour toute seule.'];
  return ['Recherche d\'un chauffeur', 'Un chauffeur va être attribué prochainement.'];
}

function render(r) {
  const mad = r.service_type === 'mise_a_disposition';
  const b = r.branding || {};
  document.title = 'Suivi de mission - ' + (b.app_name || 'Rennes VTC');

  const [title, sub] = headline(r, mad);
  const cancelled = r.status === 'cancelled';
  const current = progress(r);
  const times = r.step_times || {};
  const steps = [
    ['Réservation enregistrée', r.created_at],
    ['Chauffeur attribué', times.accepted],
    ['Chauffeur en route', times.en_route],
    [mad ? 'Mission en cours' : 'Chauffeur sur place', times.on_site],
    ['Passager à bord', times.on_board],
    ...(times.near !== 'ignore' ? [['Arrivée proche', nearOf(r)]] : []),
    ['Passager déposé', times.dropped],
    ['Mission terminée', times.completed],
  ];
  const when = (mad ? 'Mise à disposition' : 'Transfert') + ' · ' + (r.scheduled_at ? fmtTime(r.scheduled_at) : 'Dès que possible');
  const driver = r.driver;
  const live = !!r.driverPosition;
  const stopState = (i) => {
    const s = (times.stops && times.stops[i]) || {};
    if (s.skipped) return ' - passé';
    if (s.left) return ' - arrivé ' + hhmm(s.arrived) + ', reparti ' + hhmm(s.left);
    if (s.arrived) return ' - le chauffeur est sur place depuis ' + hhmm(s.arrived);
    return '';
  };
  const stopsHtml = (r.stop_addresses || []).map((s, i) => `<div class="stop"><i class="mid"></i><div><small>Arrêt${esc(stopState(i))}</small>${esc(s)}</div></div>`).join('');
  const drivers = driver ? [driver, ...(r.extraDrivers || [])] : [];
  const chatActive = !!driver && r.status === 'accepted';
  const finished = r.status === 'completed' || cancelled;

  document.getElementById('root').innerHTML = `
    <div class="grid">
      <div class="left">
        <div>
          <div class="titlerow"><span class="dot"></span><h1>Suivi de mission</h1><span class="rule"></span><span class="when">${esc(when)}</span></div>
          <p class="subtitle"><b>${esc(title)}</b>${sub ? ' — ' + esc(sub) : ''}</p>
        </div>
        ${cancelled ? '<div class="cancelled">Cette mission a été annulée.</div>' : ''}

        <div class="mapbox">
          ${live ? '<span class="live">Position en direct</span>' : ''}
          <button type="button" class="routebtn" id="route-toggle" aria-expanded="${routeOpen}">${I.routeIc}<span>Voir le trajet</span>${I.chev}</button>
          <div class="routepanel ${routeOpen ? 'open' : ''}" id="route-box">
            <div class="route">
              <div class="stop"><i></i><div><small>Départ</small>${esc(r.pickup_address)}</div></div>
              ${stopsHtml}
              <div class="stop"><i class="end"></i><div><small>Destination${r.round_trip ? ' (aller-retour)' : ''}</small>${esc(r.dropoff_address)}</div></div>
            </div>
            <div class="meta">
              ${r.client_name ? `<span class="chip">Passager : ${esc(r.client_name)}</span>` : ''}
              ${mad && r.duration_hours ? `<span class="chip">Durée : ${esc(r.duration_hours)} h</span>` : ''}
            </div>
          </div>
          <div id="map"></div>
        </div>
        ${!live && !finished ? '<p class="map-note">La position du chauffeur s\'affichera sur la carte dès qu\'il sera en route.</p>' : ''}

        ${drivers.map((d, i) => {
          const v = d.vehicle, photo = carPhoto(v);
          return `<section class="driver">
            <div class="avatarwrap">${i === 0 ? '<img class="avatar" src="/mail/avatar.png" alt="" />' : `<div class="avatar">${esc((d.firstName || 'C')[0].toUpperCase())}</div>`}</div>
            <div class="dinfo">
              <strong>${esc(d.firstName || 'Chauffeur')}</strong>
              <div class="role">${i === 0 ? 'Votre chauffeur' : 'Chauffeur supplémentaire'}</div>
              ${v ? `<div class="carline">${I.car}<span>${esc([v.display_name, v.color].filter(Boolean).join(' - '))}</span>${v.plate ? `<span class="vsep"></span><span class="plate">${esc(v.plate)}</span>` : ''}</div>` : ''}
            </div>
            ${photo ? `<img class="carphoto" src="${esc(photo)}" alt="Véhicule attribué" />` : ''}
          </section>`;
        }).join('')}

        <ol class="steps" style="--n:${steps.length}">
          ${steps.map(([label, t], i) => {
            const reached = i <= current && !cancelled;
            const isCur = i === current && !finished && !cancelled;
            const icon = isCur ? I.car : reached ? I.check : (i === steps.length - 1 ? I.flag : '');
            return `<li class="step ${reached ? 'done' : 'todo'} ${isCur ? 'current' : ''}">
              <span class="ic">${icon}</span>
              <div><div class="label">${label}</div><div class="time">${t && reached ? esc(fmtTime(t)) : ''}</div></div>
            </li>`;
          }).join('')}
        </ol>

        <div class="actions">
          ${chatActive ? `<button type="button" class="btn" id="write-driver">${I.chat}<span>Écrire au chauffeur</span></button>` : '<span></span>'}
          <a class="btn solid" href="tel:${PHONE}">${I.phone}<span>Contacter Rennes VTC</span></a>
        </div>
      </div>

      <div class="rightcol">${chatHtml(chatActive, !!driver)}</div>
    </div>
    <div class="safe">${I.shield}<span>Votre sécurité, notre priorité</span></div>`;

  const input = document.getElementById('chat-input');
  if (input && chatDraft) input.value = chatDraft;
  const form = document.getElementById('chat-form');
  if (form) { form.addEventListener('submit', sendChat); input.addEventListener('input', () => { chatDraft = input.value; }); }
  chatKey = '';
  const toggle = document.getElementById('route-toggle');
  toggle.addEventListener('click', () => {
    routeOpen = !routeOpen;
    document.getElementById('route-box').classList.toggle('open', routeOpen);
    toggle.setAttribute('aria-expanded', routeOpen);
  });
  document.getElementById('chat-min').addEventListener('click', () => { chatMin = !chatMin; document.getElementById('chat').classList.toggle('min', chatMin); });
  document.getElementById('write-driver')?.addEventListener('click', () => {
    chatMin = false; document.getElementById('chat').classList.remove('min');
    const i = document.getElementById('chat-input'); i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus();
  });
  drawMap(r);
}

function carIcon() {
  return L.divIcon({ className: '', iconSize: [24, 38], iconAnchor: [12, 19], html: '<div class="car"><b></b><b></b><b></b></div>' });
}
// Epingle blanche (depart) ou verte (destination) avec son etiquette, comme sur la maquette.
const pinIcon = (label, color) => L.divIcon({
  className: '', iconSize: [0, 0],
  html: '<div class="pinwrap"><svg viewBox="0 0 30 42"><path d="M15 1C7.3 1 1.5 6.9 1.5 14.2 1.5 24 15 41 15 41s13.5-17 13.5-26.8C28.5 6.9 22.7 1 15 1z" fill="' + color + '" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="14.5" r="5" fill="#0a0c0b"/></svg><span class="plabel">' + esc(label) + '</span></div>',
});

function drawMap(r) {
  const el = document.getElementById('map');
  if (!el) return;
  if (!r.pickup_lat || !r.pickup_lng) { el.style.display = 'none'; return; }
  // render() reconstruit le DOM : on recree la carte a chaque rafraichissement.
  if (map) { map.remove(); map = null; carMarker = null; }
  map = L.map(el, { zoomControl: false, attributionControl: true, scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
  const pts = [[r.pickup_lat, r.pickup_lng]];
  const short = String(r.pickup_address || '').split(',')[0];
  if (r.dropoff_lat && r.service_type !== 'mise_a_disposition') {
    pts.push([r.dropoff_lat, r.dropoff_lng]);
    L.polyline(pts.slice(0, 2), { color: '#22C55E', weight: 5, opacity: .95, lineCap: 'round' }).addTo(map);
    L.marker(pts[1], { icon: pinIcon('Destination', '#22C55E'), interactive: false }).addTo(map);
  }
  L.marker(pts[0], { icon: pinIcon(short || 'Départ', '#ffffff'), interactive: false }).addTo(map);
  if (r.driverPosition) {
    const p = [r.driverPosition.lat, r.driverPosition.lng];
    pts.push(p);
    carMarker = L.marker(p, { icon: carIcon() }).addTo(map);
  }
  if (pts.length === 1) map.setView(pts[0], 14);
  else map.fitBounds(pts, { paddingTopLeft: [60, 70], paddingBottomRight: [120, 30], maxZoom: 15 });
}

async function load() {
  try {
    const res = await fetch('/public/track/' + encodeURIComponent(token), { cache: 'no-store' });
    if (res.status === 404) {
      document.getElementById('root').innerHTML = '<div class="center">Ce lien de suivi est introuvable ou a expiré.</div>';
      return false;
    }
    if (!res.ok) throw new Error('http');
    const data = await res.json();
    // On ne reconstruit la page que si quelque chose a change ; sinon on deplace seulement la voiture.
    const key = JSON.stringify({ ...data, driverPosition: !!data.driverPosition });
    if (key !== lastKey) { lastKey = key; render(data); }
    else if (data.driverPosition && carMarker) carMarker.setLatLng([data.driverPosition.lat, data.driverPosition.lng]);
    chatOpen = !!data.driver && data.status === 'accepted';
    await loadChat();
    return true;
  } catch (e) {
    return true; // reseau instable : on reessaie au prochain tour
  }
}

(async function loop() {
  const ok = await load();
  if (ok) setTimeout(loop, 4000);
})();
// Au retour sur l'onglet (telephone deverrouille, etc.), on rafraichit tout de suite.
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
