<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#070908" />
<title>Navette retour - Rennes VTC</title>
<link rel="preload" href="/navette/fonts/Outfit_700Bold.ttf" as="font" type="font/ttf" crossorigin />
<link rel="preload" href="/navette/fonts/Outfit_600SemiBold.ttf" as="font" type="font/ttf" crossorigin />
<style>
  @font-face { font-family: 'Outfit'; font-weight: 600; font-display: swap; src: url('/navette/fonts/Outfit_600SemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'Outfit'; font-weight: 700; font-display: swap; src: url('/navette/fonts/Outfit_700Bold.ttf') format('truetype'); }
  @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('/navette/fonts/Inter_400Regular.ttf') format('truetype'); }
  :root {
    color-scheme: dark;
    --bg: #070908; --card: #101412; --card-2: #171c19; --line: #232b26; --line-2: #2f3933;
    --accent: #5BD42A; --accent-2: color-mix(in srgb, var(--accent) 62%, #fff); --accent-text: #08110A; --text: #F3F6F4; --muted: #94a29a;
    --amber: #F5B83D; --red: #FF6B6B;
    --title: 'Outfit', 'Inter', system-ui, sans-serif; --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; font-family: var(--body); color: var(--text); line-height: 1.5; -webkit-text-size-adjust: 100%;
    background: var(--bg); }
  .wrap { max-width: 540px; margin: 0 auto; padding: 18px 16px 56px; }
  strong, b { font-family: var(--title); font-weight: 600; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; font-family: var(--title); font-weight: 700; font-size: 20px; letter-spacing: .04em; }
  .brand img { height: 52px; max-width: 170px; object-fit: contain; }
  .brand .v { color: #5BD42A; }
  .evlogo { background: #fff; border-radius: 14px; padding: 6px 12px; display: flex; align-items: center; box-shadow: 0 6px 22px rgba(0,0,0,.4); }
  .evlogo img { height: 42px; max-width: 120px; object-fit: contain; }

  .kicker { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px 6px 10px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent-2); font-family: var(--title); font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
  .kicker::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  h1 { font-family: var(--title); font-weight: 700; font-size: clamp(30px, 9vw, 40px); line-height: 1.08; letter-spacing: -.02em; margin: 14px 0 6px; text-wrap: balance; }
  .lead { color: var(--muted); font-size: 16px; margin: 0 0 18px; }
  .lead strong { color: var(--text); }
  .infos { display: grid; gap: 10px; margin-bottom: 14px; }
  .info { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .ico { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .ico svg { width: 20px; height: 20px; }
  .info small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .info span.v { font-family: var(--title); font-weight: 600; font-size: 17px; line-height: 1.25; }
  .welcome { margin: 0 0 6px; padding: 12px 14px 12px 16px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 14px 14px 0; color: #dfe7e2; white-space: pre-line; }

  .banner { display: flex; gap: 12px; align-items: flex-start; border-radius: 18px; padding: 14px; margin: 16px 0 0; }
  .banner.ok { background: color-mix(in srgb, var(--accent) 1%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .banner.warn { background: rgba(245,184,61,.1); border: 1px solid rgba(245,184,61,.4); color: var(--amber); font-family: var(--title); font-weight: 600; align-items: center; }
  .banner .ico { background: var(--accent); color: var(--accent-text); }
  .banner .txt { flex: 1; font-size: 15px; }
  .banner .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .banner .row button { min-height: 42px; font-size: 14px; }

  h2 { display: flex; align-items: center; justify-content: space-between; font-family: var(--title); font-size: 22px; font-weight: 700; margin: 26px 2px 12px; letter-spacing: -.01em; }
  h2 small { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); }

  .dep { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 14px; transition: border-color .2s, transform .2s; }
  .dep.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .dep.off .time, .dep.off .left b { color: #6f7b74; }
  .tag { position: absolute; top: -11px; left: 16px; background: var(--accent); color: var(--accent-text); font-family: var(--title); font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 3px 11px; border-radius: 99px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .time { font-family: var(--title); font-weight: 700; font-size: 46px; line-height: 1; letter-spacing: -.03em; }
  .time em { display: block; font-style: normal; font-family: var(--body); font-weight: 400; font-size: 12.5px; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
  .right { text-align: right; }
  .chip { display: inline-block; padding: 4px 11px; border-radius: 99px; font-family: var(--title); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .chip.ok { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-2); }
  .chip.few { background: rgba(245,184,61,.14); color: var(--amber); }
  .chip.full { background: rgba(255,107,107,.13); color: var(--red); }
  .chip.off { background: var(--card-2); color: var(--muted); }
  .left { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .left b { font-size: 22px; color: var(--text); }
  .bar { height: 8px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin: 12px 0 14px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s; }
  .bar i.few { background: var(--amber); }
  .bar i.full { background: var(--red); }
  .names { margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 7px; }
  .names li { display: inline-flex; align-items: center; gap: 7px; background: var(--card-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px 4px 4px; font-size: 14px; }
  .names .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-2); font-family: var(--title); font-weight: 700; font-size: 11px; }
  .names li b { color: var(--accent-2); font-size: 13px; }
  .none { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  button { font: inherit; font-family: var(--title); font-weight: 600; cursor: pointer; border: 0; border-radius: 16px; min-height: 52px; padding: 0 18px; letter-spacing: .01em; }
  button.primary { width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 18px; font-weight: 700; color: var(--accent-text); background: var(--accent); }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary svg { width: 20px; height: 20px; }
  button.ghost { background: rgba(255,255,255,.04); color: var(--text); border: 1.5px solid var(--line-2); }
  button.danger { background: transparent; color: var(--red); border: 1.5px solid rgba(255,107,107,.5); }
  button:disabled { background: var(--card-2); color: #67746d; box-shadow: none; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(3px); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet-bg.open { display: flex; }
  .sheet { width: 100%; max-width: 540px; background: var(--card); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 12px 18px 26px; max-height: 94vh; overflow: auto; animation: up .28s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .grip { width: 44px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 0 auto 14px; }
  .sheet h3 { font-family: var(--title); font-weight: 700; font-size: 26px; margin: 0 0 2px; letter-spacing: -.01em; }
  .sheet p.sub { margin: 0 0 6px; color: var(--accent-2); font-family: var(--title); font-weight: 600; }
  label { display: block; font-family: var(--title); font-weight: 600; font-size: 14px; margin: 14px 0 6px; color: #dfe7e2; }
  input, select { width: 100%; font: inherit; font-size: 17px; min-height: 54px; padding: 0 15px; background: var(--bg); color: var(--text); border: 1.5px solid var(--line-2); border-radius: 14px; }
  input:focus, select:focus { border-color: var(--accent); }
  input[readonly] { color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .err { color: var(--red); font-weight: 600; margin: 12px 0 0; min-height: 1.2em; font-size: 15px; }
  .rgpd { color: var(--muted); font-size: 12.5px; margin: 14px 0; }

  .ticket { background: var(--card); border: 1px solid var(--line-2); border-radius: 26px; overflow: hidden; text-align: center; margin-bottom: 16px; }
  .ticket .head { padding: 26px 18px 20px; }
  .big-tick { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); }
  .big-tick svg { width: 38px; height: 38px; }
  .ticket h1 { margin: 0 0 4px; font-size: 30px; }
  .ticket .time { font-size: 64px; margin: 8px 0 0; }
  .ticket .time em { margin-top: 4px; }
  .perf { position: relative; border-top: 2px dashed var(--line-2); margin: 0 18px; }
  .perf::before, .perf::after { content: ''; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line-2); }
  .perf::before { left: -28px; } .perf::after { right: -28px; }
  .recap { padding: 18px; display: grid; gap: 14px; text-align: left; }
  .recap small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
  .recap span.v { font-family: var(--title); font-weight: 600; font-size: 18px; }
  .recap .msg { white-space: pre-line; color: #dfe7e2; }
  .note { color: var(--muted); text-align: center; margin: 0 8px 16px; font-size: 14px; }
  .center { text-align: center; padding: 28px 6px; }
  .center h1 { margin-top: 6px; }
  footer { margin-top: 30px; color: #71807a; font-size: 12px; text-align: center; line-height: 1.6; }
  a { color: var(--accent-2); }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand" id="brand"><span>RENNES <span class="v">VTC</span></span></div><div class="evlogo hidden" id="evlogo"></div></header>
  <div id="app"><p style="color:var(--muted);text-align:center;padding:40px 0">Chargement…</p></div>
  <footer id="foot"></footer>
</div>

<div class="sheet-bg" id="sheet-bg" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <form class="sheet" id="sheet" autocomplete="on" novalidate>
    <div class="grip"></div>
    <h3 id="sheet-title">Je réserve</h3>
    <p class="sub" id="sheet-sub"></p>
    <div class="two">
      <div><label for="f-first">Prénom</label><input id="f-first" name="given-name" autocomplete="given-name" maxlength="60" required /></div>
      <div><label for="f-last">Nom</label><input id="f-last" name="family-name" autocomplete="family-name" maxlength="60" required /></div>
    </div>
    <label for="f-seats">Nombre de places</label>
    <select id="f-seats"></select>
    <p class="err" id="f-err" role="alert"></p>
    <p class="rgpd">Votre prénom et votre nom sont visibles des autres invités sur ce tableau. Ils ne servent qu'à organiser les navettes de cet événement et sont supprimés 30 jours après.</p>
    <button class="primary" type="submit" id="f-submit">Confirmer ma réservation</button>
    <button class="ghost" type="button" id="f-cancel" style="width:100%;margin-top:10px">Annuler</button>
  </form>
</div>

<script>
(() => {
  const code = location.pathname.split('/').filter(Boolean).pop();
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (id) => document.getElementById(id);
  const K = (k) => `navette:${code}:${k}`;
  const ls = { get: (k) => { try { return localStorage.getItem(K(k)); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(K(k), v); } catch {} }, del: (k) => { try { localStorage.removeItem(K(k)); } catch {} } };
  const ss = { get: (k) => { try { return sessionStorage.getItem(K(k)); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(K(k), v); } catch {} } };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'd' + Math.random().toString(16).slice(2) + Date.now().toString(16));
  let device = ls.get('device'); if (!device) { device = uid(); ls.set('device', device); }
  let data = null, changing = false, target = null, busy = false, confirmShown = false;

  const I = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.3-9.2C1.4 8.3 3.5 5 6.8 5c1.9 0 3.5 1 5.2 3 1.7-2 3.3-3 5.2-3 3.3 0 5.4 3.3 4.1 6.8C19.500 16.400 12 21 12 21z"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>',
  };

  async function api(path, opt = {}) {
    const headers = { 'Content-Type': 'application/json', 'x-navette-pin': ss.get('pin') || '', 'x-navette-token': ls.get('token') || '' };
    const res = await fetch('/public/navette/' + code + path, { ...opt, headers });
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, json };
  }

  // Couleur choisie par l'organisateur : une couleur trop sombre est eclaircie pour rester visible sur le fond noir ; le texte des boutons passe en blanc ou en noir selon le contraste.
  function theme(hex) {
    const root = document.documentElement.style;
    if (!/^#[0-9a-f]{6}$/i.test(hex || '')) { root.removeProperty('--accent'); root.removeProperty('--accent-text'); return; }
    let [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
    const lum = () => 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    if (lum() < 0.12) { r = Math.round(r + (255 - r) * 0.3); g = Math.round(g + (255 - g) * 0.3); b = Math.round(b + (255 - b) * 0.3); }
    const L = lum();
    root.setProperty('--accent', 'rgb(' + r + ' ' + g + ' ' + b + ')');
    root.setProperty('--accent-text', 1.05 / (L + 0.05) > (L + 0.05) / 0.055 ? '#FFFFFF' : '#0B0F0C');
  }

  function brand(ev) {
    theme(ev.accent_color);
    const wordmark = '<span>RENNES <span class="v">VTC</span></span>';
    $('brand').innerHTML = ev.rvtc_logo ? `<img src="${esc(ev.rvtc_logo)}" alt="Rennes VTC" />` : wordmark;
    // Un logo qui ne charge pas ne doit laisser ni trou ni texte casse : repli sur le nom ecrit / masquage.
    const rv = $('brand').querySelector('img'); if (rv) rv.onerror = () => { $('brand').innerHTML = wordmark; };
    if (ev.logo_url) { $('evlogo').classList.remove('hidden'); $('evlogo').innerHTML = `<img src="${esc(ev.logo_url)}" alt="" />`; $('evlogo').querySelector('img').onerror = () => $('evlogo').classList.add('hidden'); } else { $('evlogo').classList.add('hidden'); }
    if (ev.name) document.title = ev.name + ' - Navette retour';
  }

  async function load() {
    const r = await api('');
    if (r.status === 404) { $('app').innerHTML = '<div class="center"><h1>Lien invalide</h1><p style="color:var(--muted)">Ce lien ne correspond à aucun événement. Vérifiez le QR code ou le lien reçu.</p></div>'; return; }
    if (r.status === 429) { return; }
    if (r.json.event) brand(r.json.event);
    if (r.status === 401 && r.json.needPin) { pinScreen(r.json.wrong); return; }
    if (!r.ok) return;
    data = r.json;
    if (ls.get('token') && !data.me) ls.del('token'); // inscription annulee ailleurs
    if (!confirmShown) draw();
  }

  function pinScreen(wrong) {
    $('app').innerHTML = `<span class="kicker">Accès protégé</span><h1>Code PIN</h1><p class="lead">Saisissez le code à 4 chiffres communiqué par les organisateurs.</p>
      <form id="pinform"><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••" style="font-family:var(--title);font-weight:700;font-size:34px;text-align:center;letter-spacing:.45em;min-height:68px" /><p class="err">${wrong ? 'Code incorrect.' : ''}</p><button class="primary" type="submit">Valider</button></form>`;
    $('pinform').onsubmit = (e) => { e.preventDefault(); ss.set('pin', $('pin').value.trim()); load(); };
    $('pin').focus();
  }

  const frDay = (d) => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const hh = (t) => t.replace(':', 'h');
  const initials = (name) => { const p = String(name).trim().split(/\s+/); return ((p[0] || '')[0] || '') + ((p.length > 1 ? p[p.length - 1] : '')[0] || ''); };

  function draw() {
    const ev = data.event;
    $('foot').innerHTML = 'Service proposé par <a href="https://www.rennesvtc.com" target="_blank" rel="noopener">Rennes VTC</a><br>Vos prénom et nom sont visibles des autres invités. Données supprimées 30 jours après l\'événement.';
    if (ev.status === 'termine') {
      $('app').innerHTML = `<div class="center"><div class="big-tick" style="margin:0 auto 14px">${I.heart}</div><h1>Merci et à bientôt !</h1><p class="lead">L'événement « ${esc(ev.name)} » est terminé. Merci d'avoir voyagé avec Rennes VTC.</p><p><a href="https://www.rennesvtc.com" target="_blank" rel="noopener"><strong>www.rennesvtc.com</strong></a></p></div>`;
      return;
    }
    const me = data.me;
    const myDep = me ? data.departures.find((d) => d.id === me.departure_id) : null;
    const kind = ev.type === 'mariage' ? 'Mariage' : ev.type === 'entreprise' ? 'Soirée' : 'Événement';
    let html = `<span class="kicker">${kind} · ${esc(frDay(ev.event_date))}</span><h1>${esc(ev.name)}</h1>
      <p class="lead">Réservez votre <strong>navette retour</strong> en quelques secondes.</p>
      <div class="infos">${ev.pickup_place ? `<div class="info"><span class="ico">${I.pin}</span><div><small>Rendez-vous</small><span class="v">${esc(ev.pickup_place)}</span></div></div>` : ''}${ev.destination ? `<div class="info"><span class="ico">${I.flag}</span><div><small>Destination</small><span class="v">${esc(ev.destination)}</span></div></div>` : ''}</div>
      ${ev.welcome_message ? `<div class="welcome">${esc(ev.welcome_message)}</div>` : ''}`;
    if (ev.status !== 'ouvert') html += '<div class="banner warn">Les inscriptions sont fermées pour cet événement.</div>';
    if (me && me.notice) {
      html += `<div class="banner warn" style="align-items:flex-start"><span class="ico" style="background:var(--amber);color:#1a1200">!</span><div class="txt">${esc(me.notice)}<div class="row"><button class="ghost" id="b-ack">J'ai compris</button></div></div></div>`;
    }
    if (me && myDep) {
      html += `<div class="banner ok"><span class="ico">${I.check}</span><div class="txt">Vous êtes inscrit(e), <strong>${esc(me.first_name)}</strong> : navette de <strong>${esc(hh(myDep.time))}</strong>${myDep.next_day ? ' (après minuit)' : ''} · ${me.seats} place${me.seats > 1 ? 's' : ''}.
        ${changing ? '<br>Choisissez ci-dessous votre nouveau départ.' : ''}
        <div class="row"><button class="ghost" id="b-change">${changing ? 'Garder mon départ' : 'Changer de départ'}</button><button class="danger" id="b-cancel">Annuler mon inscription</button></div></div></div>`;
    }
    html += `<h2>Les départs <small>${data.departures.length} navette${data.departures.length > 1 ? 's' : ''}</small></h2>`;
    if (!data.departures.length) html += '<p class="none">Aucun départ n\'est encore programmé.</p>';
    html += data.departures.map((d) => {
      const isMine = me && d.id === me.departure_id;
      const used = d.seats - d.remaining;
      const pct = d.seats ? Math.round((used / d.seats) * 100) : 100;
      const few = d.state === 'ouvert' && d.remaining > 0 && d.remaining <= Math.max(1, Math.floor(d.seats * 0.25));
      const cls = d.state === 'complet' ? 'full' : d.state === 'ferme' ? 'off' : few ? 'few' : 'ok';
      const chip = d.state === 'complet' ? 'Complet' : d.state === 'ferme' ? 'Fermé' : few ? 'Dernières places' : 'Disponible';
      const label = isMine ? 'Votre départ' : d.state === 'complet' ? 'Complet' : d.state === 'ferme' ? 'Inscriptions fermées' : (me ? 'Choisir ce départ' : 'Je réserve');
      const disabled = isMine || d.state !== 'ouvert' || (me && !changing);
      const arrow = !disabled ? I.arrow : '';
      return `<div class="dep ${isMine ? 'mine' : ''} ${d.state !== 'ouvert' && !isMine ? 'off' : ''}">${isMine ? '<span class="tag">Ma navette</span>' : ''}
        <div class="top"><div class="time">${esc(hh(d.time))}${d.next_day ? '<em>après minuit</em>' : ''}</div>
        <div class="right"><span class="chip ${cls}">${chip}</span><div class="left"><b>${d.remaining}</b> / ${d.seats} places</div></div></div>
        <div class="bar"><i class="${cls === 'few' || cls === 'full' ? cls : ''}" style="width:${pct}%"></i></div>
        ${d.names.length ? `<ul class="names">${d.names.map((n) => `<li><span class="av">${esc(initials(n.name))}</span>${esc(n.name)}${n.seats > 1 ? ` <b>×${n.seats}</b>` : ''}</li>`).join('')}</ul>` : '<p class="none">Personne d\'inscrit pour le moment : soyez le premier !</p>'}
        <button class="primary" data-dep="${d.id}" ${disabled ? 'disabled' : ''}>${label}${arrow}</button></div>`;
    }).join('');
    $('app').innerHTML = html;
    document.querySelectorAll('[data-dep]').forEach((b) => (b.onclick = () => openSheet(b.dataset.dep)));
    const bc = $('b-change'); if (bc) bc.onclick = () => { changing = !changing; draw(); };
    const bx = $('b-cancel'); if (bx) bx.onclick = cancelMine;
    const ack = $('b-ack'); if (ack) ack.onclick = async () => { ack.disabled = true; await api('/signup/' + encodeURIComponent(data.me.token) + '/ack', { method: 'POST', body: '{}' }); await load(); };
  }

  function openSheet(depId) {
    const d = data.departures.find((x) => x.id === depId); if (!d) return;
    target = d;
    const me = data.me;
    $('sheet-title').textContent = me ? 'Changer de départ' : 'Je réserve';
    $('sheet-sub').textContent = `Navette de ${hh(d.time)}${d.next_day ? ' (après minuit)' : ''} · ${d.remaining} place${d.remaining > 1 ? 's' : ''} restante${d.remaining > 1 ? 's' : ''}`;
    const ownSeats = me && me.departure_id === d.id ? me.seats : 0;
    const max = Math.max(1, Math.min(data.event.max_party, d.remaining + ownSeats));
    $('f-seats').innerHTML = Array.from({ length: max }, (_, i) => `<option value="${i + 1}">${i + 1} place${i ? 's' : ''}</option>`).join('');
    if (me) { $('f-first').value = me.first_name; $('f-last').value = me.last_name; $('f-seats').value = String(Math.min(me.seats, max)); $('f-first').readOnly = $('f-last').readOnly = true; }
    else { $('f-first').readOnly = $('f-last').readOnly = false; $('f-first').value = ls.get('first') || ''; $('f-last').value = ls.get('last') || ''; }
    $('f-err').textContent = '';
    $('sheet-bg').classList.add('open');
    (me ? $('f-seats') : $('f-first')).focus();
  }
  const closeSheet = () => $('sheet-bg').classList.remove('open');
  $('f-cancel').onclick = closeSheet;
  $('sheet-bg').addEventListener('click', (e) => { if (e.target.id === 'sheet-bg') closeSheet(); });

  $('sheet').onsubmit = async (e) => {
    e.preventDefault();
    if (busy || !target) return;
    const first = $('f-first').value.trim(), last = $('f-last').value.trim();
    if (!first || !last) { $('f-err').textContent = 'Indiquez votre prénom et votre nom.'; return; }
    busy = true; $('f-submit').disabled = true; $('f-err').textContent = '';
    const me = data.me;
    const body = JSON.stringify({ departure_id: target.id, first_name: first, last_name: last, seats: $('f-seats').value, device, pin: ss.get('pin') || undefined });
    const r = me ? await api('/signup/' + encodeURIComponent(me.token), { method: 'PATCH', body }) : await api('/signup', { method: 'POST', body });
    busy = false; $('f-submit').disabled = false;
    if (r.status === 401 && r.json.needPin) { closeSheet(); pinScreen(r.json.wrong); return; }
    if (!r.ok) {
      $('f-err').textContent = r.json.error || 'Inscription impossible, réessayez.';
      if (r.status === 409 || r.status === 403 || r.status === 404) await load(); // tableau remis a jour
      return;
    }
    ls.set('token', r.json.token); ls.set('first', first); ls.set('last', last);
    changing = false;
    closeSheet();
    confirmShown = false;
    await load();
    confirmation(target);
  };

  function confirmation(d) {
    const ev = data.event;
    $('app').innerHTML = `<div class="ticket"><div class="head"><div class="big-tick">${I.check}</div><h1>C'est confirmé !</h1><p class="lead" style="margin:0">Votre place est réservée sur la navette de</p>
      <div class="time">${esc(hh(d.time))}${d.next_day ? '<em>après minuit</em>' : ''}</div></div>
      <div class="perf"></div>
      <div class="recap">
        <div><small>Voyageur</small><span class="v">${esc(ls.get('first') || '')} ${esc(ls.get('last') || '')}</span></div>
        ${ev.pickup_place ? `<div><small>Rendez-vous</small><span class="v">${esc(ev.pickup_place)}</span></div>` : ''}${ev.destination ? `<div><small>Destination</small><span class="v">${esc(ev.destination)}</span></div>` : ''}
        ${ev.welcome_message ? `<div class="msg">${esc(ev.welcome_message)}</div>` : ''}</div></div>
      <p class="note">Revenez sur cette page pour changer de départ ou annuler.</p>
      <button class="primary" id="b-back">Voir le tableau des départs${I.arrow}</button>`;
    confirmShown = true;
    $('b-back').onclick = () => { confirmShown = false; draw(); };
    window.scrollTo(0, 0);
  }

  async function cancelMine() {
    if (!data.me || !confirm('Annuler votre inscription ?')) return;
    const r = await api('/signup/' + encodeURIComponent(data.me.token), { method: 'DELETE' });
    if (r.ok || r.status === 404) { ls.del('token'); changing = false; await load(); } else alert(r.json.error || 'Annulation impossible, réessayez.');
  }

  load();
  setInterval(() => { if (!document.hidden && !busy && !$('sheet-bg').classList.contains('open') && data && data.event.status !== 'termine') load(); }, 15000);
})();
</script>
</body>
</html>
